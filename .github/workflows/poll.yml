# Poll the CHPC portal from a GitHub-hosted runner and commit the record back.
#
# This replaces the laptop LaunchAgent: a runner never sleeps, never switches
# user, and always sees the portal from the same place. GitHub schedules cron
# jobs on a best-effort basis, so expect the actual cadence to be 10-20 min
# rather than exactly 10 - the observation timestamps are what count, and
# lengau_status.py already treats a late poll as a gap rather than papering
# over it.
name: poll

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two polls run at once: both would try to push the same CSV.
concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Poll the portal
        id: poll
        # A non-zero exit means 'unreachable' or 'parse failed'. Both are still
        # logged as rows, so the commit step must run regardless.
        run: python3 lengau_status.py || echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Commit the record
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lengau_observations.csv data/lengau_buckets.csv
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -q -m "poll $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q
          git push -q

      - name: Surface a failed poll
        if: steps.poll.outputs.rc != ''
        run: |
          echo "::warning::lengau_status.py exited ${{ steps.poll.outputs.rc }} - the row was still logged; see the poll step output"
